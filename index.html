<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #333;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 5%;
      font-size: 3em;
      color: #fff;
      text-shadow: 2px 2px 5px #000;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ff69b4; }
      to { text-shadow: 0 0 30px #ff1493; }
    }
    p {
      font-size: 1.5em;
      margin-top: 20px;
      color: #fff;
    }
    .surprise {
      margin-top: 30px;
      font-size: 1.2em;
      background: #ff1493;
      padding: 15px 30px;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      border: none;
    }
    #message {
      display: none;
      margin-top: 20px;
      font-size: 1.5em;
      color: #fff;
    }
    #photo {
      display: none;
      margin-top: 30px;
      width: 100%;
      max-height: 90vh;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 0 20px #fff;
    }
  </style>
</head>
<body>
  <h1>🎂 Happy Birthday Dear 🎂</h1>
  <p>Wishing you joy, love, and endless happiness!</p>

  <button class="surprise" onclick="showSurprise()">Click for Surprise 💖</button>
  <div id="message">You make the world brighter 🌎✨. Have the best birthday ever! 🎉💐</div>

  <!-- Hidden photo -->
  <img id="photo" src="birthday.jpg" alt="Birthday Celebration">

  <!-- Background music -->
  <audio autoplay loop>
    <source src="birthday.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showSurprise() {
      document.getElementById('message').style.display = 'block';
      document.getElementById('photo').style.display = 'block';
    }
  </script>
</body>
</html>
