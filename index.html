<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happiest Birthday Beautiful....!!!💖🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      transition: background 1s ease-in-out;
      overflow: hidden;
    }
    h1 {
      margin-top: 10%;
      font-size: 3em;
      text-shadow: 2px 2px 5px #000;
      animation: glow 2s infinite alternate;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ff69b4; }
      to { text-shadow: 0 0 30px #ff1493; }
    }
    p {
      font-size: 1.5em;
      margin-top: 20px;
      text-shadow: 1px 1px 3px #000;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    .surprise {
      margin-top: 30px;
      font-size: 1.2em;
      background: #ff1493;
      padding: 15px 30px;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 10px #fff;
    }
    #message {
      display: none;
      margin-top: 20px;
      font-size: 1.5em;
      text-shadow: 1px 1px 3px #000;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 10px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
      animation: slideUp 2s ease forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      z-index: -1;
    }
  </style>
</head>
<body>
  <h1 id="title">💖 Happiest Birthday Beautiful....!!!💖🎉</h1>
  <p id="subtitle">Your Smile is the Bridge Between Your Beauty and My Happiness! BE HAPPY ALWAYS....!</p>

  <button class="surprise" onclick="showSurprise()">Click here Shivuuu 💖</button>
  <div id="message">You make the world brighter 🌎✨. Have the best birthday ever! 🎉💐</div>

  <!-- Hidden audio -->
  <audio id="music" loop>
    <source src="birthday.mp3" type="audio/mpeg">
  </audio>

  <!-- Background overlay -->
  <div id="overlay"></div>

  <script>
    function showSurprise() {
      // Play music
      document.getElementById('music').play();

      // Fade in background photo
      const overlay = document.getElementById('overlay');
      overlay.style.backgroundImage = "url('birthday.jpg')"; // replace with your new photo filename
      overlay.style.opacity = "1";

      // Animate text
      document.getElementById('title').style.opacity = "1";
      document.getElementById('subtitle').style.opacity = "1";

      // Show message with slide animation
      document.getElementById('message').style.display = 'block';
    }
  </script>
</body>
</html>
