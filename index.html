<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #333;
      overflow: hidden; /* for confetti */
    }
    h1 {
      margin-top: 5%;
      font-size: 3em;
      color: #fff;
      text-shadow: 2px 2px 5px #000;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #ff69b4; }
      to { text-shadow: 0 0 30px #ff1493; }
    }
    p {
      font-size: 1.5em;
      margin-top: 20px;
      color: #fff;
    }
    img {
      margin-top: 20px;
      width: 300px;
      border-radius: 15px;
      box-shadow: 0 0 20px #fff;
    }
    .surprise {
      margin-top: 30px;
      font-size: 1.2em;
      background: #ff1493;
      padding: 15px 30px;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      border: none;
    }
    #message {
      display: none;
      margin-top: 20px;
      font-size: 1.5em;
      color: #fff;
    }
    /* Confetti style */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: red;
      animation: fall 5s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>🎂 Happy Birthday Dear 🎂</h1>
  <p>Wishing you joy, love, and endless happiness!</p>

  <!-- Birthday photo -->
  <img src="birthday.jpg" alt="Birthday Celebration">

  <button class="surprise" onclick="showMessage()">Click for Surprise 💖</button>
  <div id="message">You make the world brighter 🌎✨. Have the best birthday ever! 🎉💐</div>

  <!-- Background music -->
  <audio autoplay loop>
    <source src="birthday.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showMessage() {
      document.getElementById('message').style.display = 'block';
    }

    // Confetti generator
    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.backgroundColor = ['red','blue','yellow','green','pink'][Math.floor(Math.random()*5)];
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 5000);
    }
    setInterval(createConfetti, 200);
  </script>
</body>
</html>
